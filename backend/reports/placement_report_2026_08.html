
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>
        Placement Report - 08/2026
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 30px 0;
        }

        .card {
            border: 1px solid #ccc;
            padding: 20px;
            flex: 1;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Placement Report</h1>

    <h2>
        08/2026
    </h2>

    <div class="stats">

        <div class="card">
            <h3>Total Students</h3>
            <p>2</p>
        </div>

        <div class="card">
            <h3>Total Companies</h3>
            <p>2</p>
        </div>

        <div class="card">
            <h3>Placements</h3>
            <p>0</p>
        </div>

        <div class="card">
            <h3>Average Salary</h3>
            <p>₹0.00</p>
        </div>

    </div>

    <h2>Placement Details</h2>

    <table>

        <tr>
            <th>Student</th>
            <th>Company</th>
            <th>Position</th>
            <th>Salary</th>
            <th>Joining Date</th>
        </tr>

    </table>

    <h2>Company-wise Placements</h2>

    <table>

        <tr>
            <th>Company</th>
            <th>Placements</th>
        </tr>

    </table>

</body>
</html>
